# ==============================================
# CONFIGURACIÓN DE PRODUCCIÓN
# ==============================================
# Este archivo usa variables de entorno para mayor seguridad
# Configura las variables en tu servidor o archivo .env

# Base de datos de producción
# Soporta variables de Railway (MYSQL_*) y variables estándar (DB_*)
# Railway: MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD, MYSQL_URL
# Estándar: DB_URL, DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# Prioridad: MYSQL_URL > DB_URL > variables individuales Railway > variables estándar
# NOTA: Si ninguna variable está configurada, la aplicación fallará al iniciar (comportamiento esperado en producción)
spring.datasource.url=${MYSQL_URL:${DB_URL:jdbc:mysql://${MYSQLHOST:${DB_HOST:localhost}}:${MYSQLPORT:${DB_PORT:3306}}/${MYSQLDATABASE:${DB_NAME:railway}}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}}
spring.datasource.username=${MYSQLUSER:${DB_USERNAME:root}}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool optimizado para producción
# Timeouts aumentados para Railway (puede haber retrasos en el inicio del servicio MySQL)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:60000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}
spring.datasource.hikari.initialization-fail-timeout=${DB_INIT_FAIL_TIMEOUT:60000}
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA / Hibernate - Producción
# En Railway, la base de datos puede estar vacía inicialmente, por lo que usamos 'update' para crear las tablas automáticamente
# Si prefieres validar sin crear, cambia esta propiedad a 'validate' mediante la variable de entorno JPA_DDL_AUTO
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.use_sql_comments=false
spring.jpa.properties.hibernate.jdbc.batch_size=${JPA_BATCH_SIZE:50}

# Logging en producción (menos verboso)
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.veterinaria=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
logging.file.name=${LOG_FILE_NAME:logs/veterinaria.log}
logging.file.max-size=${LOG_FILE_MAX_SIZE:50MB}
logging.file.max-history=${LOG_FILE_MAX_HISTORY:60}

# JWT - DEBE configurarse con variable de entorno en producción
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Email (opcional - si no se configuran, el email estará deshabilitado)
# Para habilitar email, configura EMAIL_HOST, EMAIL_USERNAME y EMAIL_PASSWORD en Railway
# Si estas variables no están configuradas, el email estará deshabilitado automáticamente
# NOTA: La auto-configuración de email se deshabilita y se configura manualmente solo si EMAIL_HOST está disponible
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
# Estas propiedades solo se usan si EMAIL_HOST está configurado (ver MailConfig.java)
spring.mail.host=${EMAIL_HOST:disabled}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.debug=false

# Swagger deshabilitado en producción
springdoc.swagger-ui.enabled=false

# CORS para producción
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Configuración personalizada
app.file.upload-dir=${APP_UPLOAD_DIR:/var/uploads}
app.file.max-size=${APP_MAX_FILE_SIZE:10MB}
app.nombre=${APP_NOMBRE:Clínica Veterinaria}

# Configuración de Email y Contacto
app.email.from=${EMAIL_FROM:${spring.mail.username}}
app.frontend.url=${FRONTEND_URL}
app.contacto.telefono=${CONTACTO_TELEFONO:}
app.contacto.direccion=${CONTACTO_DIRECCION:}
app.contacto.email=${CONTACTO_EMAIL:${spring.mail.username}}

