# ==============================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ==============================================
spring.application.name=${APP_NAME:Sistema Gestion Veterinaria}
server.port=${SERVER_PORT:8080}
# server.servlet.context-path=/api/v1  # Comentado: los controllers ya definen sus propias rutas /api/...

# Perfil activo (dev, test, prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================================
# CONFIGURACIÓN DE BASE DE DATOS
# ==============================================
# Usa variables de entorno o valores por defecto
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:veterinaria_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Bogota&useLegacyDatetimeCode=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:300000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1200000}

# ==============================================
# CONFIGURACIÓN JPA / HIBERNATE
# ==============================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=${JPA_BATCH_SIZE:20}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Auditing
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ==============================================
# CONFIGURACIÓN DE SEGURIDAD JWT
# ==============================================
# IMPORTANTE: En producción, usa una variable de entorno con un secret seguro
jwt.secret=${JWT_SECRET:4f8a6d2e9b1c3f7a5d8e2b9c4f6a1d3e7b5c8f2a6d9e1c4b7f3a5d8e2b9c6f1a}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Configuración de intentos de login
security.login.max-intentos=${SECURITY_LOGIN_MAX_INTENTOS:5}
security.login.bloqueo-duracion-minutos=${SECURITY_LOGIN_BLOQUEO_DURACION_MINUTOS:15}

# ==============================================
# CONFIGURACIÓN DE SWAGGER / OPENAPI
# ==============================================
# Paths de la documentación
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Habilitar Swagger UI
springdoc.swagger-ui.enabled=true

# Ordenamiento
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Paquetes a escanear
springdoc.packages-to-scan=com.veterinaria.presentation.controller

# Configuración adicional
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntax-highlight.activated=true

# ==============================================
# CONFIGURACIÓN DE VALIDACIÓN
# ==============================================
spring.mvc.throw-exception-if-no-handler-found=true
# spring.web.resources.add-mappings=false  # Comentado para permitir Swagger UI

# ==============================================
# CONFIGURACIÓN DE LOGGING
# ==============================================
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.veterinaria=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=${LOG_FILE_NAME:logs/veterinaria.log}
logging.file.max-size=${LOG_FILE_MAX_SIZE:10MB}
logging.file.max-history=${LOG_FILE_MAX_HISTORY:30}

# ==============================================
# CONFIGURACIÓN DE CACHÉ
# ==============================================
spring.cache.type=simple
spring.cache.cache-names=usuarios,pacientes,productos,citas

# ==============================================
# CONFIGURACIÓN DE EMAIL
# ==============================================
spring.mail.host=${EMAIL_HOST:smtp.gmail.com}
spring.mail.port=${EMAIL_PORT:587}
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================================
# CONFIGURACIÓN DE PAGINACIÓN
# ==============================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ==============================================
# CONFIGURACIÓN DE JACKSON
# ==============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
# Nota: LocalDate y LocalTime no usan zona horaria, se manejan como strings ISO

# ==============================================
# CONFIGURACIÓN DE ACTUATOR (Monitoreo)
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ==============================================
# CONFIGURACIÓN PERSONALIZADA
# ==============================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200}
app.file.upload-dir=${APP_UPLOAD_DIR:uploads}
app.file.max-size=${APP_MAX_FILE_SIZE:5MB}
app.nombre=${APP_NOMBRE:Clínica Veterinaria VetCare}

# Configuración de Email
app.email.from=${EMAIL_FROM:${spring.mail.username}}

# URL del Frontend (para links en emails)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# Información de Contacto de la Clínica
app.contacto.telefono=${CONTACTO_TELEFONO:}
app.contacto.direccion=${CONTACTO_DIRECCION:}
app.contacto.email=${CONTACTO_EMAIL:${spring.mail.username}}
