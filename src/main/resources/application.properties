# ==============================================
# CONFIGURACIÓN GENERAL DE LA APLICACIÓN
# ==============================================
spring.application.name=Sistema Gestion Veterinaria
server.port=8080
# server.servlet.context-path=/api/v1  # Comentado: los controllers ya definen sus propias rutas /api/...

# Perfil activo (dev, test, prod)
spring.profiles.active=dev

# ==============================================
# CONFIGURACIÓN DE BASE DE DATOS
# ==============================================
spring.datasource.url=jdbc:mysql://localhost:3306/veterinaria_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ==============================================
# CONFIGURACIÓN JPA / HIBERNATE
# ==============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Auditing
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ==============================================
# CONFIGURACIÓN DE SEGURIDAD JWT
# ==============================================
jwt.secret=4f8a6d2e9b1c3f7a5d8e2b9c4f6a1d3e7b5c8f2a6d9e1c4b7f3a5d8e2b9c6f1a
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Configuración de intentos de login
security.login.max-intentos=5
security.login.bloqueo-duracion-minutos=15

# ==============================================
# CONFIGURACIÓN DE SWAGGER / OPENAPI
# ==============================================
# Paths de la documentación
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Habilitar Swagger UI
springdoc.swagger-ui.enabled=true

# Ordenamiento
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Paquetes a escanear
springdoc.packages-to-scan=com.veterinaria.presentation.controller

# Configuración adicional
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntax-highlight.activated=true

# ==============================================
# CONFIGURACIÓN DE VALIDACIÓN
# ==============================================
spring.mvc.throw-exception-if-no-handler-found=true
# spring.web.resources.add-mappings=false  # Comentado para permitir Swagger UI

# ==============================================
# CONFIGURACIÓN DE LOGGING
# ==============================================
logging.level.root=INFO
logging.level.com.veterinaria=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/veterinaria.log
logging.file.max-size=10MB
logging.file.max-history=30

# ==============================================
# CONFIGURACIÓN DE CACHÉ
# ==============================================
spring.cache.type=simple
spring.cache.cache-names=usuarios,pacientes,productos,citas

# ==============================================
# CONFIGURACIÓN DE EMAIL
# ==============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==============================================
# CONFIGURACIÓN DE PAGINACIÓN
# ==============================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# ==============================================
# CONFIGURACIÓN DE JACKSON
# ==============================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ==============================================
# CONFIGURACIÓN DE ACTUATOR (Monitoreo)
# ==============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ==============================================
# CONFIGURACIÓN PERSONALIZADA
# ==============================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200
app.file.upload-dir=uploads
app.file.max-size=5MB
