# ==============================================
# CONFIGURACIÓN DE TESTING
# ==============================================

# Base de datos H2 en memoria para tests
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA para tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Escaneo de entidades
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# Configuración adicional de Hibernate para tests
spring.jpa.defer-datasource-initialization=false

# H2 Console
spring.h2.console.enabled=true

# Logging mínimo en tests
logging.level.root=WARN
logging.level.com.veterinaria=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# JWT para tests (512 bits = 64 caracteres mínimo para HS512)
jwt.secret=test-secret-key-for-testing-purposes-only-with-sufficient-length-for-hs512-algorithm-security-requirements
jwt.expiration=3600000

# Email mock
spring.mail.host=localhost
spring.mail.port=1025
